<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1224" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motor Yıkama">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Motor Yıkama Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  /* direction: marker-sketch mood with a game mission layer. paper ground, ink lines, blue accent.
     layout: three views. 1) gear grid, one button. 2) one step per screen: mission HUD, sketch stage, title, reason, items, three lines, warning, action bar, one button. 3) mission complete */
  --bg:#F4F0E9; --stage:#EFE6D6; --surface:#FFFFFF; --ink:#131C36; --muted:#5B6479; --line:#D9D2C6;
  --water:#1B5CD6; --water-soft:#D6E3FA; --on-water:#FFFFFF;
  --warn:#A2400C; --warn-bg:#FBE3D3; --iron:#7A3FB0; --ok:#17775A;
  --bike:#131C36; --metal:#8793A8; --tire:#0E1528; --foam:#FFFFFF;
  --shard-a:#F3B595; --shard-b:#EBCF9B; --shard-c:#B9CDEC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1224; --stage:#141C33; --surface:#18213A; --ink:#EEF1F8; --muted:#9AA5BF; --line:#2A3553;
    --water:#6FA2FF; --water-soft:#1A2B55; --on-water:#07122B;
    --warn:#F6B08C; --warn-bg:#3B2416; --iron:#B98BE8; --ok:#5ED0A7;
    --bike:#E3E8F4; --metal:#7C89A6; --tire:#B4BED6; --foam:#F4F6FB;
    --shard-a:#5A3324; --shard-b:#4A3E22; --shard-c:#1E3463;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1224; --stage:#141C33; --surface:#18213A; --ink:#EEF1F8; --muted:#9AA5BF; --line:#2A3553;
  --water:#6FA2FF; --water-soft:#1A2B55; --on-water:#07122B;
  --warn:#F6B08C; --warn-bg:#3B2416; --iron:#B98BE8; --ok:#5ED0A7;
  --bike:#E3E8F4; --metal:#7C89A6; --tire:#B4BED6; --foam:#F4F6FB;
  --shard-a:#5A3324; --shard-b:#4A3E22; --shard-c:#1E3463;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1{margin:0;font:italic 700 38px/1 var(--display);text-wrap:balance}

.app{height:100%;max-width:520px;margin:0 auto}
.view{height:100%;display:none;flex-direction:column;overflow:hidden}
.app[data-view="list"] .list,.app[data-view="step"] .step,.app[data-view="done"] .done{display:flex}
.foot{padding:10px 16px 16px;flex-shrink:0;display:grid;gap:10px}
.go{width:100%;padding:17px 12px;border:0;border-radius:14px;background:var(--water);color:var(--on-water);font:italic 700 24px/1 var(--display);letter-spacing:.02em}
.lab{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--water)}

/* gear view */
.lhead{padding:18px 16px 12px;display:grid;gap:6px}
.lhead p{margin:0;font-size:16px;color:var(--muted)}
.lhead::after{content:"";width:104px;height:7px;border-radius:2px;transform:skewX(-18deg);background:linear-gradient(90deg,var(--shard-a) 0 34%,var(--shard-b) 34% 67%,var(--water) 67%)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:2px 16px 12px;align-content:start}
.tile{display:grid;gap:6px;align-content:start;justify-items:center;padding:0;border:0;background:none;text-align:center;font:500 13px/1.2 var(--body);color:var(--ink)}
.pic{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;background:#FFFFFF;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;padding:8px}
.pic svg{width:68%;height:68%;fill:none;stroke:#131C36;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.buy{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:999px;background:#FBE8D4;color:#A14606;font:600 11px var(--body)}
.tick{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:#17775A;display:none;place-items:center}
.tick svg{width:14px;height:14px;stroke:#FFFFFF;stroke-width:3.5}
.tile[aria-pressed="true"] .pic{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.tile[aria-pressed="true"] .tick{display:grid}

/* mission HUD */
.hud{display:grid;grid-template-columns:44px minmax(0,1fr) 92px;gap:8px;align-items:stretch;padding:10px 16px;flex-shrink:0}
.back{width:44px;height:44px;align-self:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.mission,.meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.m-top{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 14px/1.1 var(--body);white-space:nowrap}
.m-top .lab{margin-right:4px}
.m-step{font-variant-numeric:tabular-nums;color:var(--muted)}
.zones{list-style:none;margin:7px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font:500 12px/1.2 var(--body);color:var(--muted)}
.zones li{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.zones i{width:12px;height:12px;flex-shrink:0;border:1.5px solid currentColor;border-radius:3px;display:grid;place-items:center;transition:background-color .3s,border-color .3s}
.zones li.now{color:var(--ink);font-weight:600}
.zones li.now i{border-color:var(--water);box-shadow:0 0 0 2px var(--water-soft)}
.zones li.done{color:var(--ok)}
.zones li.done i{background:var(--ok);border-color:var(--ok)}
.zones li.done i::after{content:"";width:6px;height:3px;border:solid #FFFFFF;border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.meter{position:relative;display:grid;align-content:space-between;gap:4px}
.meter strong{font:italic 700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:6px}
.segs i{background:var(--line);border-radius:1px;transition:background-color .2s}
.segs i.on{background:var(--water)}
.meter.full .segs i.on{background:var(--ok)}
.bump{position:absolute;right:8px;top:4px;font:italic 700 20px/1 var(--display);color:var(--ok);pointer-events:none;opacity:0}

/* stage */
.stage{position:relative;margin:0 16px;background:#F3EFE8;border-radius:14px;overflow:hidden;flex-shrink:0;cursor:pointer;
  --ink:#131C36;--surface:#FFFFFF;--line:#D9D2C6;--water:#1B5CD6;--water-soft:#D6E3FA;--warn:#B84A0E;--iron:#8A3FC8;--ok:#128A63;--foam:#FFFFFF;--metal:#8793A8;--mark:#0A9A96}
.stage svg{display:block;width:100%;height:auto;max-height:190px}
#bike,#dirt,.fxs,.cap-base{transition:opacity .35s,filter .35s}
#dirt > *{transition:opacity .9s ease}
#dirt.noanim > *{transition:none}
#dirt .gone{opacity:0}

/* step body */
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 6px;display:flex;flex-direction:column;gap:12px}
.body h1{font-size:34px}
.why{margin:-4px 0 0;font:500 16px/1.35 var(--body);color:var(--muted)}
.why b{font-weight:600;color:var(--ink)}
.use{display:flex;gap:10px}
.use .tile{width:80px;font-size:12px;overflow-wrap:anywhere}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:n;font:500 18px/1.3 var(--body)}
.todo li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.todo li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 17px/28px var(--display);text-align:center}
.warn{margin:0;padding:10px 12px;display:flex;gap:9px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:10px;font:500 16px/1.35 var(--body)}
.warn::before{content:"!";flex:0 0 20px;height:20px;margin-top:1px;border-radius:50%;border:2px solid currentColor;font:700 13px/16px var(--body);text-align:center}
[hidden]{display:none!important}

/* action bar */
.action{width:100%;display:grid;gap:8px;padding:10px 12px;border:2px solid var(--water);border-radius:12px;background:var(--surface);text-align:left}
.a-row{display:flex;align-items:center;gap:10px}
.key{width:30px;height:30px;flex-shrink:0;border-radius:8px;background:var(--water);color:var(--on-water);display:grid;place-items:center}
.key svg{width:14px;height:14px;fill:currentColor;display:none}
.action .k-play,.action.run .k-stop,.action.done .k-again{display:block}
.action.run .k-play,.action.done .k-play{display:none}
.a-label{flex:1;min-width:0;font:600 16px/1.25 var(--body)}
.a-time{font:italic 700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.a-bar{height:6px;border-radius:3px;background:var(--water-soft);overflow:hidden}
.a-bar i{display:block;height:100%;width:0;background:var(--water);transition:width .25s linear}
.action.done{border-color:var(--ok)}
.action.done .key,.action.done .a-bar i{background:var(--ok)}

/* drawing */
.cap{font:600 14px var(--body);fill:var(--ink)}
.num{font:700 13px var(--display);fill:var(--surface)}
.big{font:700 26px var(--display);fill:var(--ink)}
.ring{fill:none;stroke:var(--warn);stroke-width:2.5;stroke-dasharray:5 3}
.slash{stroke:var(--warn);stroke-width:2.5;stroke-linecap:round}
.hl{fill:var(--mark);fill-opacity:.22;stroke:var(--mark);stroke-width:3}
.halo{fill:none;stroke:#FFFFFF;stroke-width:6;opacity:.85}
.blob{fill:var(--foam);stroke:#B9C2D3;stroke-width:1.5;transform-box:fill-box;transform-origin:center}
.iron{fill:var(--iron);opacity:.7}
.dropdot{fill:var(--water)}
.mitt{transform:translate(200px,74px)}
.towel{transform:translate(200px,74px)}
.cloth{transform:translate(100px,90px)}
.water-level{transform-box:fill-box;transform-origin:bottom}
.puff{transform-box:fill-box;transform-origin:center}
.fx{display:none}
.app[data-step="1"] .fx-1,.app[data-step="2"] .fx-2,.app[data-step="3"] .fx-3,.app[data-step="4"] .fx-4,.app[data-step="5"] .fx-5,
.app[data-step="6"] .fx-6,.app[data-step="7"] .fx-7,.app[data-step="8"] .fx-8,.app[data-step="9"] .fx-9,.app[data-step="10"] .fx-10{display:block}
.app[data-step="4"] #bike,.app[data-step="4"] #dirt,.app[data-step="4"] .cap-base{opacity:.14}
.app[data-step="8"] .cap-base,.app[data-step="9"] .cap-base,.app[data-step="10"] .cap-base{display:none}

/* product wheel */
.wring{opacity:0;pointer-events:none;transform-origin:180px 111.5px;transform:scale(.82) rotate(-28deg);transition:transform .5s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.stage.wheel-on .wring{opacity:1;transform:none}
.stage.wheel-on #bike,.stage.wheel-on #dirt,.stage.wheel-on .fxs,.stage.wheel-on .cap-base{opacity:.2;filter:blur(2px)}
.wseg path{fill:#FFFFFF;stroke:#D9D2C6;stroke-width:1;transition:fill .2s,stroke .2s}
.wseg use{fill:none;stroke:#131C36;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.3;transition:opacity .2s}
.wseg{transform-box:fill-box;transform-origin:center}
.wseg.hot path{fill:#1B5CD6;stroke:#1B5CD6}
.wseg.hot use{stroke:#FFFFFF;opacity:1}
.wcore{fill:#FFFFFF;stroke:#D9D2C6;stroke-width:1}
.wlab{font:600 10px var(--body);letter-spacing:.14em;fill:#1B5CD6}
.wname{font:600 13px var(--body);fill:#131C36}

/* mission complete */
.dbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 0 8px}
.dstage{margin:0 16px;background:#F3EFE8;border-radius:14px;overflow:hidden}
.dstage svg{display:block;width:100%;height:auto;max-height:230px}
.spark{fill:#FFFFFF;stroke:#1B5CD6;stroke-width:1.6;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.banner{margin:22px -6px 0;padding:16px 22px 18px;background:var(--ink);color:var(--bg);transform:skewY(-3deg)}
.banner p{margin:0;transform:skewY(3deg)}
.b-main{font:italic 700 46px/1 var(--display);letter-spacing:.01em}
.b-sub{margin-top:8px!important;font:600 13px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--water-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 16px 0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats dt{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--water)}
.stats dd{margin:5px 0 0;font:italic 700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.link{justify-self:center;background:none;border:0;padding:6px 10px;font:600 15px var(--body);color:var(--muted);text-decoration:underline}

@media (prefers-reduced-motion: no-preference){
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  .band{animation:sweep 2.6s linear infinite}
  .drop{animation:fall 1s linear infinite}
  .ring,.slash{animation:pulse 1.2s ease-in-out infinite}
  .iron{animation:react 2.4s ease-in-out infinite alternate}
  .brush{animation:scrub .7s ease-in-out infinite alternate}
  .water-level{animation:fillup 3.2s ease-in-out infinite}
  .stream{animation:flow .5s linear infinite}
  .fx-5 .blob{animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}
  .fx-7 .blob{animation:washoff .5s linear both}
  .mitt{animation:wipe 8s ease-in-out infinite}
  .towel{animation:dry 8s ease-in-out infinite}
  .fx-8 .dropdot{animation:washoff .4s linear both}
  .cap-off{animation:capoff .9s ease-in 1s both}
  .hl{animation:pulse 1.3s ease-in-out infinite}
  .cloth{animation:polish 1.6s ease-in-out infinite alternate}
  .puff{animation:puff 1.6s ease-out infinite}
  .app[data-step="10"] #bike{animation:idle .12s linear infinite alternate}
  .zones li.pop i{animation:boxpop .5s cubic-bezier(.3,1.6,.5,1)}
  .bump.show{animation:bump 1.3s ease-out}
  .wseg.hot{animation:segpop .35s cubic-bezier(.3,1.6,.5,1)}
  .celebrate .banner{animation:bandin .6s cubic-bezier(.2,1,.3,1) .3s both}
  .celebrate .stats div{animation:rise .45s ease-out both}
  .celebrate .stats div:nth-child(1){animation-delay:.8s}
  .celebrate .stats div:nth-child(2){animation-delay:.95s}
  .celebrate .stats div:nth-child(3){animation-delay:1.1s}
  .celebrate .spark{animation:spark 2.2s ease-in-out infinite both}
  .celebrate .glint{animation:glint 3.4s ease-in-out .9s infinite}
}
@media (prefers-reduced-motion: reduce){
  .wring,#bike,#dirt,.fxs,.cap-base,#dirt > *{transition:none}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sweep{from{transform:translateY(0)}to{transform:translateY(172px)}}
@keyframes fall{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(16px);opacity:0}}
@keyframes react{from{opacity:.12}to{opacity:.8}}
@keyframes scrub{from{transform:translateY(-7px)}to{transform:translateY(9px)}}
@keyframes fillup{0%{transform:scaleY(.12)}70%,100%{transform:scaleY(1)}}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes washoff{from{opacity:1}to{opacity:0}}
@keyframes wipe{
  0%{transform:translate(262px,48px)}10%{transform:translate(200px,74px)}20%{transform:translate(240px,72px)}30%{transform:translate(180px,84px)}
  42%{transform:translate(140px,92px)}52%{transform:translate(70px,92px)}62%{transform:translate(120px,96px)}
  74%{transform:translate(160px,132px)}84%{transform:translate(206px,146px)}94%{transform:translate(130px,160px)}100%{transform:translate(262px,48px)}
}
@keyframes dry{0%{transform:translate(200px,74px)}22%{transform:translate(100px,90px)}45%{transform:translate(170px,134px)}68%{transform:translate(67px,164px)}90%{transform:translate(287px,161px)}100%{transform:translate(200px,74px)}}
@keyframes capoff{to{transform:translate(-30px,-6px);opacity:0}}
@keyframes polish{from{transform:translate(66px,88px)}to{transform:translate(140px,94px)}}
@keyframes puff{from{transform:translate(0,0) scale(.6);opacity:.7}to{transform:translate(-26px,-10px) scale(2);opacity:0}}
@keyframes idle{to{transform:translateY(.8px)}}
@keyframes boxpop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes bump{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
@keyframes segpop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes bandin{from{transform:skewY(-3deg) translateX(-108%)}to{transform:skewY(-3deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spark{0%,100%{transform:scale(0);opacity:0}30%{transform:scale(1.15) rotate(25deg);opacity:1}65%{transform:scale(.8) rotate(45deg);opacity:.9}}
@keyframes glint{0%{transform:translateX(0)}45%,100%{transform:translateX(560px)}}
@media (max-height:800px){.stage svg{max-height:135px}.body{gap:10px}.body h1{font-size:30px}.todo{font-size:17px}.why{font-size:15px}.warn{font-size:15px}.use .tile{width:68px}.action{padding:8px 10px;gap:6px}.dstage svg{max-height:170px}.b-main{font-size:40px}}
.app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>

/* mission zones: s = step indexes (0-based) that make up the zone */
var ZONES = [

  {n:"Plastikler", s:[8]}

/* cleanliness after each step is finished */
var CLEAN = [5,20,35,40,50,75,85,92,98,100];

var app = document.getElementById("app");

var NS = "http://www.w3.org/2000/svg";
var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
var i = 0, view = "list", checked = {}, startAt = null, doneAt = null;

try {
  var saved = JSON.parse(localStorage.getItem("yikama-v3") || localStorage.getItem("yikama-v2") || "{}") || {};

/* gear tiles */
function useIcon(id){

function buildGrid(){ var g = el("grid"); g.textContent = ""; ORDER.forEach(function(k){ g.appendChild(tile(k, true)); }); }
buildGrid();

/* mission zones */
var zoneEls = ZONES.map(function(z){
  var li = document.createElement("li"), box = document.createElement("i"), tx = document.createElement("span");
  tx.textContent = z.n; li.appendChild(box); li.appendChild(tx); el("zones").appendChild(li); return li;
});
function completedCount(){ return view === "done" ? STEPS.length : i; }
function renderZones(animate){
  var c = completedCount();
  ZONES.forEach(function(z, k){
    var li = zoneEls[k], wasDone = li.classList.contains("done");
    var done = z.s.every(function(s){ return s < c; });

/* cleanliness meter */
function pctNow(){ return view === "done" ? 100 : (i === 0 ? 0 : CLEAN[i - 1]); }
function paintPct(v){
  var segs = el("segs").children, on = Math.ceil(v / 10 - 0.001);
  el("pct").textContent = Math.round(v) + "%";
  for (var k = 0; k < segs.length; k++) segs[k].className = k < on ? "on" : "";

}
function setPct(target, animate){

  var b = el("bump"); b.textContent = "+" + (target - from) + "%"; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");

/* dirt layer on the sketch: each spot has a = appears once this many steps are done, c = gone once this many steps are done */
var dirtSpots = [];
(function buildDirt(){
  var seed = 1300;
  function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function rr(a, b){ return a + (b - a) * rnd(); }
  function blob(cx, cy, r){
    var n = 7, p = [], d = "", k;
    for (k = 0; k < n; k++) { var a = k / n * Math.PI * 2 + rr(-.25, .25), q = r * rr(.65, 1.15); p.push([cx + Math.cos(a) * q, cy + Math.sin(a) * q]); }
    for (k = 0; k < n; k++) {
      var c = p[k], nx = p[(k + 1) % n], pv = p[(k + n - 1) % n];
      if (k === 0) d += "M" + ((pv[0] + c[0]) / 2).toFixed(1) + " " + ((pv[1] + c[1]) / 2).toFixed(1);
      d += "Q" + c[0].toFixed(1) + " " + c[1].toFixed(1) + " " + ((c[0] + nx[0]) / 2).toFixed(1) + " " + ((c[1] + nx[1]) / 2).toFixed(1);
    }

  }
  var g = el("dirt");
  function put(kind, x, y, r, c, a){
    var node;

    else if (kind === "dust") { node = document.createElementNS(NS, "circle"); node.setAttribute("cx", x.toFixed(1)); node.setAttribute("cy", y.toFixed(1)); node.setAttribute("r", r.toFixed(1)); node.setAttribute("fill", "#8A6236"); node.setAttribute("opacity", ".6"); }
    else if (kind === "scuff") { node = document.createElementNS(NS, "ellipse"); node.setAttribute("cx", x.toFixed(1)); node.setAttribute("cy", y.toFixed(1)); node.setAttribute("rx", r.toFixed(1)); node.setAttribute("ry", (r * .28).toFixed(1)); node.setAttribute("transform", "rotate(" + rr(-12, 12).toFixed(0) + " " + x.toFixed(1) + " " + y.toFixed(1) + ")"); node.setAttribute("fill", "#9AA0AA"); node.setAttribute("opacity", ".7"); }
    else { node = document.createElementNS(NS, "circle"); node.setAttribute("cx", x.toFixed(1)); node.setAttribute("cy", y.toFixed(1)); node.setAttribute("r", r.toFixed(1)); node.setAttribute("fill", "#CFE0F7"); node.setAttribute("stroke", "#3E6FB8"); node.setAttribute("stroke-width", ".8"); node.setAttribute("opacity", ".75"); }
    node.style.transitionDelay = (x / 360 * .5).toFixed(2) + "s";
    g.appendChild(node); dirtSpots.push({el:node, a:a || 0, c:c});
  }
  [[67, 164], [286, 161]].forEach(function(w){
    var k, a, q;
    for (k = 0; k < 9; k++) { a = rr(.12, .95) * Math.PI; q = rr(34, 42); put("mud", w[0] + Math.cos(a) * q, w[1] + Math.sin(a) * q, rr(4, 7), rnd() < .65 ? 3 : 6); }
    for (k = 0; k < 7; k++) { a = rr(.05, 1) * Math.PI; q = rr(12, 29); put("mud", w[0] + Math.cos(a) * q, w[1] + Math.sin(a) * q, rr(2.5, 5), 3); }
  });
  var k;
  for (k = 0; k < 14; k++) put("mud", rr(150, 232), rr(150, 188), rr(3.5, 7.5), rnd() < .6 ? 6 : 7);
  for (k = 0; k < 6; k++) put("mud", rr(45, 112), rr(118, 148), rr(2.5, 5), 6);
  for (k = 0; k < 5; k++) put("mud", rr(256, 306), rr(110, 126), rr(2.5, 4.5), 6);
  for (k = 0; k < 24; k++) { var dx = rr(95, 250); put("dust", dx, rr(dx < 150 ? 88 : 64, 140), rr(1.4, 2.8), rnd() < .5 ? 2 : 6); }
  [[25, 55, 92, 100, 3], [62, 138, 84, 95, 3], [228, 242, 90, 115, 2], [262, 292, 116, 124, 2]].forEach(function(b){
    for (var j = 0; j < b[4]; j++) put("scuff", rr(b[0], b[1]), rr(b[2], b[3]), rr(6, 10), 9);

})();
function updateDirt(done, instant){
  var g = el("dirt");
  if (instant || reduce) g.classList.add("noanim");
  dirtSpots.forEach(function(s){ s.el.classList.toggle("gone", !(done >= s.a && done < s.c)); });
  if (instant || reduce) { void g.getBoundingClientRect(); requestAnimationFrame(function(){ g.classList.remove("noanim"); }); }
}

/* product wheel */
var WX = 180, WY = 111.5, WR = 102, Wr = 56, wsegs = {};
(function buildWheel(){
  var g = el("wheelSegs"), n = ORDER.length, gap = .022;
  function pt(a, r){ return (WX + Math.cos(a) * r).toFixed(1) + " " + (WY + Math.sin(a) * r).toFixed(1); }
  ORDER.forEach(function(key, k){
    var step = 2 * Math.PI / n, a0 = -Math.PI / 2 + (k - .5) * step + gap, a1 = -Math.PI / 2 + (k + .5) * step - gap, am = (a0 + a1) / 2, rm = (WR + Wr) / 2;
    var seg = document.createElementNS(NS, "g"), path = document.createElementNS(NS, "path"), u = document.createElementNS(NS, "use");
    seg.setAttribute("class", "wseg");
    path.setAttribute("d", "M" + pt(a0, WR) + "A" + WR + " " + WR + " 0 0 1 " + pt(a1, WR) + "L" + pt(a1, Wr) + "A" + Wr + " " + Wr + " 0 0 0 " + pt(a0, Wr) + "Z");
    u.setAttribute("href", "#" + ITEMS[key].icon);
    u.setAttribute("x", (WX + Math.cos(am) * rm - 12).toFixed(1)); u.setAttribute("y", (WY + Math.sin(am) * rm - 12).toFixed(1));
    u.setAttribute("width", "24"); u.setAttribute("height", "24");
    seg.appendChild(path); seg.appendChild(u); g.appendChild(seg); wsegs[key] = seg;
  });
})();
function svgText(parent, txt, y, cls){
  var t = document.createElementNS(NS, "text");
  t.setAttribute("x", WX); t.setAttribute("y", y.toFixed(1)); t.setAttribute("text-anchor", "middle"); t.setAttribute("dominant-baseline", "middle"); t.setAttribute("class", cls);
  t.textContent = txt; parent.appendChild(t);
}
function playWheel(){
  var st = STEPS[i], stage = el("stage"), tg = el("wheelText");
  clearTimeout(wheelT); hotT.forEach(clearTimeout); hotT = [];
  Object.keys(wsegs).forEach(function(k){ wsegs[k].classList.remove("hot"); });
  tg.textContent = "";
  var names = st.use.map(function(k){ return ITEMS[k].s || ITEMS[k].n; }), lh = 15, y0 = WY - (17 + (names.length - 1) * lh) / 2;
  svgText(tg, "BU ADIMDA", y0, "wlab");
  names.forEach(function(nm, k){ svgText(tg, nm, y0 + 17 + k * lh, "wname"); });
  stage.classList.remove("wheel-on"); void stage.getBoundingClientRect(); stage.classList.add("wheel-on");
  st.use.forEach(function(k, n){ hotT.push(setTimeout(function(){ wsegs[k].classList.add("hot"); }, reduce ? 0 : 380 + n * 160)); });
  wheelT = setTimeout(function(){ stage.classList.remove("wheel-on"); }, reduce ? 1600 : WHEEL_MS);
}
el("stage").addEventListener("click", playWheel);

/* action bar with timer */
function fmt(sec){ var m = Math.floor(sec / 60), r = sec % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
function resetTimer(){
  clearInterval(tick); tick = null; tState = "idle";
  var st = STEPS[i], a = el("action");
  a.className = "action"; a.hidden = !st.timer || view !== "step";
  if (!st.timer) return;
  el("aLabel").textContent = (st.timer / 60) + " dakikalık sayacı başlat";
  el("aTime").textContent = fmt(st.timer);
  el("aFill").style.width = "0%";
}
function beep(){
  try {
    if (!actx) return;
    [0, .35, .7].forEach(function(o){
      var osc = actx.createOscillator(), g = actx.createGain();
      osc.frequency.value = 880; g.gain.value = .15; osc.connect(g); g.connect(actx.destination);
      osc.start(actx.currentTime + o); osc.stop(actx.currentTime + o + .2);
    });
  } catch (e) {}
}
el("action").addEventListener("click", function(){
  var st = STEPS[i], a = el("action");
  if (tState === "run") { resetTimer(); return; }
  try { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { actx = actx || new AC(); if (actx.resume) actx.resume(); } } catch (e) { actx = null; }
  tState = "run"; endAt = Date.now() + st.timer * 1000;
  a.className = "action run"; el("aLabel").textContent = st.tl;
  function upd(){
    var left = Math.max(0, endAt - Date.now());
    el("aTime").textContent = fmt(Math.ceil(left / 1000));
    el("aFill").style.width = ((1 - left / (st.timer * 1000)) * 100).toFixed(1) + "%";
    if (left <= 0) { clearInterval(tick); tick = null; tState = "done"; a.className = "action done"; el("aLabel").textContent = st.td; beep(); }
  }
  upd(); tick = setInterval(upd, 250);
});

/* mission complete */
function renderDone(){
  if (!doneAt) doneAt = Date.now();
  var ms = startAt ? doneAt - startAt : 0, txt = "—";
  if (ms > 30000 && ms < 4 * 3600000) { var m = Math.max(1, Math.round(ms / 60000)); txt = m < 60 ? m + " dk" : Math.floor(m / 60) + " sa " + (m % 60) + " dk"; }
  el("dTime").textContent = txt;
  app.classList.remove("celebrate"); void app.offsetWidth; app.classList.add("celebrate");
}

/* main render */
function render(){
  app.setAttribute("data-view", view);
  if (view === "done") { clearInterval(tick); tick = null; renderZones(false); renderDone(); lastView = view; save(); return; }
  app.classList.remove("celebrate");
  if (view === "list") { lastView = view; save(); return; }
  var st = STEPS[i], changed = i !== lastI || lastView !== "step";
  app.setAttribute("data-step", String(i + 1));
  el("count").textContent = (i + 1) + "/" + STEPS.length;
  renderZones(dir === 1);
  setPct(pctNow(), dir === 1);
  el("title").textContent = st.t;
  var wy = el("why"); wy.textContent = ""; var wb = document.createElement("b"); wb.textContent = "Neden: "; wy.appendChild(wb); wy.appendChild(document.createTextNode(st.y));
  var u = el("use"); u.textContent = ""; st.use.forEach(function(k){ u.appendChild(tile(k, false)); });
  var ol = el("todo"); ol.textContent = "";
  st.d.forEach(function(x){ var li = document.createElement("li"), sp = document.createElement("span"); sp.textContent = x; li.appendChild(sp); ol.appendChild(li); });
  el("warn").textContent = st.w;
  el("next").textContent = i === STEPS.length - 1 ? "Bitti" : "Tamam, sonraki";
  resetTimer();
  el("body").scrollTop = 0;
  if (changed) {
    clearTimeout(dirtT);
    if (dir === 1) { var doneNow = i; dirtT = setTimeout(function(){ updateDirt(doneNow, false); }, reduce ? 0 : WHEEL_MS + 150); }
    else updateDirt(i, true);
    playWheel();
  }
  lastI = i; lastView = view; dir = 0;
  save();
}
function forward(){
  dir = 1;
  if (i === STEPS.length - 1) { view = "done"; doneAt = Date.now(); } else i++;
  render();
}
function backward(){ dir = -1; if (i === 0) view = "list"; else i--; render(); }
el("start").addEventListener("click", function(){ if (i === 0 || !startAt) startAt = Date.now(); doneAt = null; view = "step"; dir = 0; render(); });
el("next").addEventListener("click", forward);
el("back").addEventListener("click", backward);
el("reopen").addEventListener("click", function(){ view = "step"; i = STEPS.length - 1; doneAt = null; dir = -1; lastI = -1; render(); });
el("finish").addEventListener("click", function(){
  i = 0; view = "list"; checked = {}; startAt = null; doneAt = null; lastI = -1; shownPct = 0;
  buildGrid(); updateDirt(0, true); render();
});
document.addEventListener("keydown", function(e){
  if (view !== "step") return;
  if (e.key === "ArrowRight") forward();
  if (e.key === "ArrowLeft") backward();
});
updateDirt(view === "done" ? STEPS.length : i, true);
shownPct = pctNow(); paintPct(shownPct);
render();
if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
